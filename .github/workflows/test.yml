name: CI Pipeline

on:
  push:
    # Runs on every push to any branch
  pull_request:
    branches: [develop]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    # The MySQL service is always available, but only used in the E2E step
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mydb_test
          MYSQL_ROOT_PASSWORD: secretpassword
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. Run Linting
        run: npm run lint

      - name: 2. Run Unit Tests & Coverage
        run: npm run test -- --coverage

      - name: 3. Run E2E Tests
        # ONLY runs if it's a Pull Request AND the target branch is 'develop'
        # if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USERNAME: appuser
          DB_PASSWORD: apppassword
          DB_DATABASE: mydb_test
        run: npm run test:e2e
